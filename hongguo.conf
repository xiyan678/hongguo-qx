# ============================================================
# 红果短剧 · 圈X 配置（唯一版本 v1.0 · 2026-10-28）
# 从此只用这一个文件，其它 .conf 全部作废
# 只需改一处：把 APP_HOST 换成你抓到的域名
# 没替换 APP_HOST 时：广告照样拦，VIP 段不触发，也不会白屏
# ============================================================

[filter_local]
# 只拦最确定的广告域名，通配不收太宽，避免误伤正片 CDN
host, api.pangle.io, reject
host, *.pangle.io, reject
host, *.pangolin-sdk-toutiao.com, reject
host, *.pglstatp-toutiao.com, reject
host, log-api.pangle.io, reject

[rewrite_local]
# VIP 状态：只挂用户态接口，不碰 detail / list，避免加载失败
^https?:\/\/APP_HOST\/.*\/user\/(info|profile).* url script-response-body https://cdn.jsdelivr.net/gh/xiyan678/hongguo-qx@main/hongguo_qx.js
^https?:\/\/APP_HOST\/.*\/(member|vip)\/(info|status).* url script-response-body https://cdn.jsdelivr.net/gh/xiyan678/hongguo-qx@main/hongguo_qx.js

# 剧集锁：风险项，默认关闭。确认 App 不白屏后再打开
# ^https?:\/\/APP_HOST\/.*\/drama\/detail.* url script-response-body https://cdn.jsdelivr.net/gh/xiyan678/hongguo-qx@main/hongguo_qx.js

# 广告配置接口：回空 JSON
^https?:\/\/.*(pangle|gromore|adslot|ad_config).* url reject-dict

[mitm]
hostname = APP_HOST, api.pangle.io, *.pangle.io, *.pangolin-sdk-toutiao.com
