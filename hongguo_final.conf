# ============================================================
# 红果短剧 · Quantumult X 最终配置（复制即用）
# 仓库：https://github.com/xiyan678/hongguo-qx
# 脚本直链已内置，不用改
# 唯一需要改的：把 APP_HOST 换成你抓到的域名（共 2 处）
# 还没抓包？只粘 [filter_local] 一段，广告立刻掉一半
# 生成日期：2026-10-28
# ============================================================

[filter_local]
# ---------- A 段：广告/埋点域名黑洞（无占位符，立即可用）----------
host, *.pangle.io, reject
host, api.pangle.io, reject
host, *.pangolin-sdk-toutiao.com, reject
host, *.gromore.cn, reject
host, *.pglstatp-toutiao.com, reject
host, *.adn*.com, reject
host, *.adn*.cn, reject
host, *.adsbyte.com, reject
host, adsn.trantor.bytedance.com, reject
host, log-api.pangle.io, reject

# ---------- 触发 QUIC 导致 MITM 失效时，打开下面两条 ----------
# ip6-cidr, ::/0, reject
# ip-cidr, 0.0.0.0/0, reject

[rewrite_local]
# ---------- B 段：VIP 字段改写 ----------
# 把 APP_HOST 换成抓包得到的域名后才会生效（未替换时只是匹配不到，不会报错）
^https?:\/\/APP_HOST\/.*(user\/profile|user\/info|profile\/v\d|member\/info|vip\/info|account\/info).* url script-response-body https://raw.githubusercontent.com/xiyan678/hongguo-qx/main/hongguo_qx.js

# ---------- B 段：剧集锁定标记解除 ----------
^https?:\/\/APP_HOST\/.*(episode|episodes|drama|series|video\/list|play\/list|detail).* url script-response-body https://raw.githubusercontent.com/xiyan678/hongguo-qx/main/hongguo_qx.js

# ---------- B 段：广告配置接口回空 ----------
^https?:\/\/.*(pangle|gromore|adslot|ad_slot|ad_config|ad-config|reward_video).* url reject-dict

# ---------- 备用脚本源：raw 拉取失败时，把上面两处链接换成这条 ----------
# https://cdn.jsdelivr.net/gh/xiyan678/hongguo-qx@main/hongguo_qx.js

[mitm]
# 把 APP_HOST 换成抓包域名；广告域名保持原样
hostname = APP_HOST, api.pangle.io, *.pangle.io, *.gromore.cn, *.pangolin-sdk-toutiao.com
