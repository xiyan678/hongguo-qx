;======================================================
; 红果短剧 圈X 配置片段
; 用法：把下面各段按节名合并进你的 Quantumult X 配置文件
; 注意：%APP_API_HOST% 必须替换成你抓包得到的真实业务域名
;======================================================

[filter_local]
; ---------- 广告 / 埋点域名：直接黑洞（最安全，先上这段）----------
host, *.pangle.io, reject
host, api.pangle.io, reject
host, *.pangolin-sdk-toutiao.com, reject
host, *.gromore.cn, reject
host, *.pglstatp-toutiao.com, reject
host, *.adn*.com, reject
host, *.adn*.cn, reject
host, *.adsbyte.com, reject
host, adsn.trantor.bytedance.com, reject
host, log-api.pangle.io, reject

; ---------- 若目标域名走 QUIC 导致 MITM 失效，加这两条让它回落 TCP ----------
; ip6-cidr, ::/0, reject
; ip-cidr, 0.0.0.0/0, reject

[rewrite_local]
; ---------- 用户 / 会员状态：改 VIP ----------
; 把 %APP_API_HOST% 换成真实域名，路径按你抓到的改
^https?:\/\/%APP_API_HOST%\/.*(user\/profile|user\/info|profile\/v\d|member\/info|vip\/info|account\/info).* url script-response-body hongguo_qx.js

; ---------- 剧集 / 播放列表：解除锁定标记 ----------
^https?:\/\/%APP_API_HOST%\/.*(episode|episodes|drama|series|video\/list|play\/list|detail).* url script-response-body hongguo_qx.js

; ---------- 广告配置接口：回空对象 ----------
^https?:\/\/.*(pangle|gromore|adslot|ad_slot|ad_config|ad-config|reward_video).* url reject-dict

[mitm]
; 只 MITM 必须改的域名，别把业务域名全列进来
hostname = %APP_API_HOST%, api.pangle.io, *.pangle.io, *.gromore.cn, *.pangolin-sdk-toutiao.com
